<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sunset — Animation Film</title>
        <link rel="stylesheet" href="styles.css">
        <meta name="referrer" content="strict-origin-when-cross-origin">
    </head>
    <body>
        <!-- <div class="container"> -->
        <div class="background-gradient">
            <nav>
                <a href="index.html" aria-label="Home"><img src="images/name_logo.png" class="logo" alt="logo"></a>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="art.html">Art</a></li>
                </ul>
            </nav>

        <main id="portfolio">
            <div class="container">
                <h1 class="sub-title about">Short Animation Clips</h1>
                <section class="animation-video-embed">
                    <div class="video-embed">
                        <iframe id="video-player" width="560" height="315" 
                        src="https://www.youtube.com/embed/giiEpRClE8k?si=2x0g9RVDW7E0RMAT" 
                        title="YouTube video player" frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        referrerpolicy="strict-origin-when-cross-origin" 
                        rel=0 controls=0 modestbranding=1
                        mute=1 autoplay=1
                        allowfullscreen>
                    </iframe>
                    </div>
                </section>

                <div class="card-section">
                    <div class="card-container">
                        <article class="card-article video-trigger" data-video-url="https://www.youtube.com/embed/giiEpRClE8k?si=2x0g9RVDW7E0RMAT">
                            <img src="images/ribboned_cover.png" alt="ribboned">

                            <div class="card-data">
                                <h2 class="card-title">Light</h2>
                                <span class="card-description">Stop-motion and puppetry</span>
                            </div>
                        </article>

                        <article class="card-article video-trigger" data-video-url="https://www.youtube.com/embed/giiEpRClE8k?si=2x0g9RVDW7E0RMAT">
                            <img src="images/ribboned_cover.png" alt="ribboned">

                            <div class="card-data">
                                <h2 class="card-title">Life of a Teacup</h2>
                                <span class="card-description">Stop-motion and lighting</span>
                            </div>
                        </article>

                        <article class="card-article video-trigger" data-video-url="https://www.youtube.com/embed/giiEpRClE8k?si=2x0g9RVDW7E0RMAT">
                            <img src="images/ribboned_cover.png" alt="ribboned">

                            <div class="card-data">
                                <h2 class="card-title">Light</h2>
                                <span class="card-description">Stop-motion and puppetry</span>
                            </div>
                        </article>

                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const videoPlayer = document.getElementById('video-player');
        const cards = document.querySelectorAll('video-trigger');

        cards.forEach(card => {
            card.addEventListener('click', function() {
                const activeVideoUrl = this.getAttribute('data-video-url');

                videoPlayer.src = activeVideoUrl;
            });
        });
    </script>
</body>
</html>
