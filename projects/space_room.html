        <div class="art-lightbox" id="simpleLightbox">
            <div class="art-lightbox-content">
                <button class="lightbox-close" id="simpleLightboxClose" aria-label="Close">&times;</button>
                <figure class="lightbox-figure">

    <script>
        document.addEventListener('DOMContentLoaded', () => {
        const lightbox = document.getElementById('simpleLightbox');
        const lightboxImage = document.getElementById('simpleLightboxImage');
        const closeBtn = document.getElementById('simpleLightboxClose');

        document.querySelectorAll('.project-images-layout img').forEach((img) => {
            img.style.cursor = 'zoom-in';
            img.addEventListener('click', () => {
            lightboxImage.src = img.src;
            lightboxImage.alt = img.alt || '';
            lightbox.classList.add('active');
            });
        });

        function closeLightbox() {
            lightbox.classList.remove('active');
            lightboxImage.src = '';
        }

        closeBtn.addEventListener('click', closeLightbox);

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });
        });
    </script>
